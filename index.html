<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Akıllı Evrak</title>
  <meta name="description" content="Öğretmenler için MEB uyumlu evrak hazırlama uygulaması">
  <style>
    :root {
      --lacivert: #16264A;
      --altin: #D4AF37;
      --zemin: #F5F5F0;
      --metin: #333333;
      --soluk: #6B7280;
      --gri: #D1D5DB;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--zemin);
      color: var(--metin);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    main {
      width: 100%;
      max-width: 440px;
      text-align: center;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
      color: var(--lacivert);
    }
    .aciklama {
      margin: 0 0 32px;
      font-size: 1.05rem;
      line-height: 1.5;
      color: var(--metin);
    }
    .dugme {
      display: block;
      width: 100%;
      padding: 16px 20px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      text-decoration: none;
      margin-bottom: 14px;
    }
    .dugme-play {
      background: var(--lacivert);
      color: #FFFFFF;
      border: 2px solid var(--altin);
    }
    .dugme-play:hover, .dugme-play:focus { background: #1F3566; }
    .dugme-pasif {
      background: #ECECEC;
      color: #9AA0A6;
      border: 2px solid var(--gri);
      cursor: not-allowed;
      user-select: none;
    }
    .alt {
      margin-top: 32px;
      font-size: 0.9rem;
      color: var(--soluk);
      line-height: 1.8;
    }
    .alt a { color: var(--lacivert); }
  </style>
</head>
<body>
  <main>
    <h1>Akıllı Evrak</h1>
    <p class="aciklama">Öğretmenler için MEB uyumlu evrak hazırlama uygulaması</p>

    <a class="dugme dugme-play" href="https://play.google.com/store/apps/details?id=com.akillievrak.plan">Google Play'den İndir</a>
    <span class="dugme dugme-pasif" aria-disabled="true">App Store — Yakında</span>

    <div class="alt">
      <a href="gizlilik/">Gizlilik Politikası</a><br>
      Destek: <a href="mailto:akillievrakdestek@gmail.com">akillievrakdestek@gmail.com</a>
    </div>
  </main>
</body>
</html>
